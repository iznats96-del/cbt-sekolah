name: Build CBT Sekolah

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 tidak di-set. Build tanpa tanda tangan."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > cbt-release.keystore
            echo "keystore decoded"
          fi

      - name: Build APK (with retry)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/cbt-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEYPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $i of $MAX_RETRIES ==="
            if flutter build apk --release --obfuscate --split-debug-info=debug; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 30s before retry..."
            sleep 30
          done
          echo "All $MAX_RETRIES attempts failed"
          exit 1

      - name: Build Web
        run: flutter build web --release

      - name: Upload APK artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cbt-sekolah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

      - name: Upload Web artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cbt-sekolah-web
          path: build/web/
          retention-days: 3

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: CBT Sekolah ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          generate_release_notes: true

# Catatan keamanan: keystore & password hanya via GitHub Secrets, tidak di repo.